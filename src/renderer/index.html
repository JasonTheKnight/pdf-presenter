<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Presenter</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="presenter">
    <header class="toolbar">
      <button id="openPdfButton" class="text-button">Open PDF</button>
      <div class="divider"></div>
      <button id="firstButton" class="icon-button" title="First page" aria-label="First page" disabled>&laquo;</button>
      <button id="previousButton" class="icon-button" title="Previous page" disabled>&larr;</button>
      <span id="pageStatus" class="page-status">No PDF open</span>
      <button id="nextButton" class="icon-button" title="Next page" disabled>&rarr;</button>
      <div class="divider"></div>
      <div class="tool-toggle" role="group" aria-label="Annotation tool">
        <button class="tool-button active" data-tool="pointer" type="button">Pointer</button>
        <button class="tool-button" data-tool="line" type="button">Line</button>
        <button class="tool-button" data-tool="rectangle" type="button">Rectangle</button>
      </div>
      <button id="clearAnnotationsButton" class="text-button" type="button" disabled>Clear</button>
      <div class="spacer"></div>
      <select id="displaySelect" disabled></select>
      <button
        id="refreshDisplaysButton"
        class="icon-button"
        type="button"
        title="Refresh screen list"
        aria-label="Refresh screen list"
        disabled
      >
        &#8635;
      </button>
      <button id="presentButton" class="text-button" disabled>Present on screen</button>
      <button id="stopButton" class="text-button danger" hidden>Stop presenting</button>
    </header>

    <main class="presenter-layout">
      <section class="pdf-stage">
        <section id="emptyState" class="empty-state">
          <h1>Open a PDF to present</h1>
          <p id="emptyStateMessage">Use the button above or File &gt; Open PDF.</p>
        </section>
        <div id="slideSurface" class="slide-surface" hidden>
          <canvas id="pdfCanvas"></canvas>
          <svg id="annotationLayer" class="annotation-layer" viewBox="0 0 1000 1000" preserveAspectRatio="none"></svg>
          <div id="laserPointer" class="laser-pointer" hidden></div>
        </div>
      </section>
      <aside class="notes-panel" aria-label="Page notes">
        <section class="sidebar-panel notes-content-panel" data-collapsible-panel="notes" aria-labelledby="notesHeading">
          <div class="panel-header notes-header">
            <h2 id="notesHeading">Notes</h2>
            <div class="panel-header-actions">
              <span id="notesSaveStatus" class="notes-save-status">No PDF open</span>
              <button class="panel-toggle" type="button" aria-label="Collapse Notes" aria-expanded="true">
                <span class="panel-toggle-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="panel-body notes-body">
            <textarea
              id="notesEditor"
              class="notes-editor"
              placeholder="Notes for this page"
              spellcheck="true"
              disabled
            ></textarea>
          </div>
        </section>
        <section class="sidebar-panel next-slide-panel" data-collapsible-panel="next-slide" aria-labelledby="nextSlideHeading">
          <div class="panel-header next-slide-header">
            <h2 id="nextSlideHeading">Next slide</h2>
            <div class="panel-header-actions">
              <span id="nextSlideStatus" class="next-slide-status">No PDF open</span>
              <button class="panel-toggle" type="button" aria-label="Collapse Next slide" aria-expanded="true">
                <span class="panel-toggle-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="panel-body next-slide-body">
            <div id="nextSlidePreview" class="next-slide-preview">
              <canvas id="nextSlideCanvas" hidden></canvas>
              <p id="nextSlideMessage">No PDF open</p>
            </div>
          </div>
        </section>
        <section class="sidebar-panel workshop-panel" data-collapsible-panel="workshop" aria-labelledby="workshopHeading">
          <div class="panel-header workshop-header">
            <h2 id="workshopHeading">Workshop timer</h2>
            <div class="panel-header-actions">
              <button id="disconnectWorkshopButton" class="panel-button" type="button" hidden>Disconnect</button>
              <button class="panel-toggle" type="button" aria-label="Collapse Workshop timer" aria-expanded="true">
                <span class="panel-toggle-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
          <div class="panel-body workshop-body">
            <div id="workshopConnectPrompt" class="workshop-connect-prompt">
              <p>Connect to Workshop timer</p>
              <button id="showWorkshopFormButton" class="panel-button primary" type="button">Connect</button>
            </div>
            <form id="workshopUrlForm" class="workshop-url-form" hidden>
              <label for="workshopUrlInput">Workshop timer URL</label>
              <div class="workshop-url-controls">
                <input id="workshopUrlInput" type="url" placeholder="https://example.com/timer" required />
                <button class="panel-button primary" type="submit">Load</button>
              </div>
              <p id="workshopUrlError" class="workshop-url-error" role="alert" hidden></p>
            </form>
            <iframe
              id="workshopFrame"
              class="workshop-frame"
              title="Workshop timer"
              hidden
            ></iframe>
          </div>
        </section>
      </aside>
    </main>

    <script type="module" src="./viewer.js"></script>
  </body>
</html>
